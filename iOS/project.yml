name: Leftoverledger
options:
  bundleIdPrefix: com.shimondeitel.leftovers
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Leftoverledger:
    type: application
    platform: iOS
    sources:
      - path: Leftoverledger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.leftovers
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Leftoverledger/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  LeftoverledgerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LeftoverledgerTests
      - path: Leftoverledger.storekit
    dependencies:
      - target: Leftoverledger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.leftovers.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  LeftoverledgerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LeftoverledgerUITests
    dependencies:
      - target: Leftoverledger
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.leftovers.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Leftoverledger:
    build:
      targets:
        Leftoverledger: all
        LeftoverledgerTests: [test]
        LeftoverledgerUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Leftoverledger.storekit
    test:
      config: Debug
      storeKitConfiguration: Leftoverledger.storekit
      targets:
        - LeftoverledgerTests
        - LeftoverledgerUITests
    archive:
      config: Release
